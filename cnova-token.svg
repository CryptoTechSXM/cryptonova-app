<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0"/>
      <stop offset="60%" style="stop-color:#00b8d4"/>
      <stop offset="100%" style="stop-color:#0095ff"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2040"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="96" fill="url(#coinGrad)"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="80" fill="url(#innerGrad)"/>
  <!-- Nova burst rays -->
  <g opacity="0.3" stroke="#00e5a0" stroke-width="1.5">
    <line x1="100" y1="25" x2="100" y2="40"/>
    <line x1="100" y1="160" x2="100" y2="175"/>
    <line x1="25" y1="100" x2="40" y2="100"/>
    <line x1="160" y1="100" x2="175" y2="100"/>
    <line x1="47" y1="47" x2="57" y2="57"/>
    <line x1="143" y1="143" x2="153" y2="153"/>
    <line x1="153" y1="47" x2="143" y2="57"/>
    <line x1="47" y1="153" x2="57" y2="143"/>
  </g>
  <!-- CN monogram -->
  <text x="100" y="88" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="42" fill="url(#coinGrad)" text-anchor="middle" dominant-baseline="middle">CN</text>
  <!-- NOVA label -->
  <text x="100" y="128" font-family="Arial, sans-serif" font-weight="700"
    font-size="18" fill="#00e5a0" text-anchor="middle" letter-spacing="6">NOVA</text>
</svg>
