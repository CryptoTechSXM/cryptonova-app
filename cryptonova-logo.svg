  <text x="302" y="160" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#00d68f" letter-spacing="1">2026</text>

  <!-- CRYPTONOVA wordmark -->
  <text x="200" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#e8e8e8" letter-spacing="4">CRYPTONOVA</text>

  <!-- Tagline -->
  <text x="200" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#00d68f" letter-spacing="0.8">Built on chain. Powered by community</text>

</svg>
